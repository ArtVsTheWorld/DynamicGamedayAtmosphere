[Arrivals]
Enabled=1
StartPercent=65
LateSchoolStartPercent=45
ModerateStartPercent=55
FinishPercentOfQuarter=25
LateSchoolFinishPercentOfQuarter=75
ModerateFinishPercentOfQuarter=50
HalftimeSeatBreakPercent=10
BigGameBonus=20
