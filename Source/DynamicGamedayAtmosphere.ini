[Audio]
Enabled=1
; No ordinary crowd-volume cut at this attendance or above.
ReductionStartPercent=80
; Percentage of signal volume removed at the bottom of the curve; 0 = off.
; Default: 2.5% less volume per ten attendance points below 80 (17.5% cut at 10).
; A completely empty crowd is silent. Changed targets fade over six seconds.
MaximumReductionPercent=20
ChantStrength=100
; No extra attenuation at 70% attendance or above. Gentle fade below that.
ChantReductionPercent=50

[Replays]
Enabled=1
; Let ordinary runs/completions use the game's play-selection replay window.
InsetAfterRoutinePlays=1
; Lower the existing full-screen big-play selectors; native first-down and
; special-scene rules still apply. These replays keep the normal skip control.
FullScreenBigPlays=1
FullScreenMinimumYards=15
; Prefer native sack replays; use run/pass insets for tackles for loss.
; Interceptions and lost fumbles retain their existing replay sequences.
DefensiveHighlights=1

[Logging]
; Logs clear before an entry would exceed this size; no archives are created.
MaxFileMB=2
Debug=0
